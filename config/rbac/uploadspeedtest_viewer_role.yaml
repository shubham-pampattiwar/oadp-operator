# permissions for end users to view uploadspeedtests.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: uploadspeedtest-viewer-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: oadp-operator
    app.kubernetes.io/part-of: oadp-operator
    app.kubernetes.io/managed-by: kustomize
  name: uploadspeedtest-viewer-role
rules:
- apiGroups:
  - oadp.openshift.io
  resources:
  - uploadspeedtests
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - oadp.openshift.io
  resources:
  - uploadspeedtests/status
  verbs:
  - get
